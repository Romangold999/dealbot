name: Python checks

on:
  push:
    branches: [dealbot-2.0-dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project
        run: python -m compileall -q bot.py scanner.py detector.py db.py tests
      - name: Run detector tests
        run: python -m unittest discover -s tests -v
