name: Dealbot runner

on:
  push:
    branches: [dealbot-2.0-dev]
    paths:
      - ".github/workflows/dealbot-run.yml"
      - "bot.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealbot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RESULTS_PER_MARKETPLACE: "12"
      SEARCH_WORKERS: "2"
      MIN_DEAL_SCORE: "78"
      HISTORY_DROP_THRESHOLD: "0.30"
      MAX_ALERTS_PER_DAY: "30"
    steps:
      - name: Check out Dealbot 2.0
        uses: actions/checkout@v4
        with:
          ref: dealbot-2.0-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Restore Dealbot database cache
        uses: actions/cache/restore@v4
        with:
          path: deals.db
          key: dealbot-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dealbot-db-

      - name: Verify bot configuration without printing secrets
        run: |
          python - <<'PY'
          from dotenv import load_dotenv
          import os
          load_dotenv()
          token = os.getenv("BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("BOT_TOKEN is not available to the application")
          print("BOT_TOKEN loaded: YES (value hidden)")
          PY

      - name: Run Dealbot
        run: python -u bot.py

      - name: Save Dealbot database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deals.db
          key: dealbot-db-${{ github.run_id }}-${{ github.run_attempt }}
