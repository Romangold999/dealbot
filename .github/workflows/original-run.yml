name: Original Dealbot runner

on:
  push:
    branches: [dealbot-2.0-dev]
    paths:
      - ".github/workflows/original-run.yml"

permissions:
  contents: read

concurrency:
  group: dealbot-runner
  cancel-in-progress: false

jobs:
  run-original:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out original stable version from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Restore original bot database
        uses: actions/cache/restore@v4
        with:
          path: deals.db
          key: dealbot-original-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dealbot-original-db-

      - name: Verify bot configuration without printing secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          from dotenv import load_dotenv
          import os
          env_file = Path.cwd() / ".env"
          if not env_file.is_file():
              raise SystemExit(".env file is missing from the original main branch")
          load_dotenv(dotenv_path=env_file)
          if not os.getenv("BOT_TOKEN", "").strip():
              raise SystemExit("BOT_TOKEN is not available to the original application")
          print("Original bot configuration: OK (token hidden)")
          PY

      - name: Run original Dealbot
        run: python -u bot.py

      - name: Save original bot database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deals.db
          key: dealbot-original-db-${{ github.run_id }}-${{ github.run_attempt }}
